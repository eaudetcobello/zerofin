<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>MovieStreamer</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#111;color:#eee;font:32px/1.3 sans-serif}
.screen{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;box-sizing:border-box}
.on{display:block}
#browse{padding:60px 120px}
h1{margin:0 0 8px;font-size:48px}
.hint{opacity:.5;margin:0 0 24px;font-size:26px}
#list{height:860px;overflow:hidden}
.dir{opacity:.5;font-size:26px;margin:24px 0 4px}
.item{padding:12px 20px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.sel{background:#eee;color:#111}
#setup{padding:200px 300px}
#addr{font:inherit;padding:16px;width:100%;box-sizing:border-box}
#err{color:#f77;margin-top:20px}
#player.on{background:transparent}
#av{position:absolute;left:0;top:0;width:1920px;height:1080px}
#sub{position:absolute;left:160px;right:160px;bottom:90px;text-align:center;font-size:52px;text-shadow:0 0 6px #000,0 0 6px #000,0 0 3px #000;white-space:pre-line;transition:bottom .2s}
#sub.up{bottom:250px}
#pill{position:absolute;top:60px;left:0;right:0;text-align:center;opacity:0;transition:opacity .25s}
#pill span{display:inline-block;padding:14px 32px;border-radius:999px;background:rgba(0,0,0,.7);font-size:30px}
#pill.show{opacity:1}
#osd{position:absolute;left:0;right:0;bottom:0;padding:120px 100px 50px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85));opacity:0;transition:opacity .25s}
#osd.show{opacity:1}
#name{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
#bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin:24px 0 14px}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff;width:0}
#knob{position:absolute;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;left:0}
#osd .row{display:flex;justify-content:space-between;font-size:24px;opacity:.7}
</style>
</head>
<body>
<div id="setup" class="screen">
  <h1>Server address</h1>
  <p class="hint">The address moviestreamer prints, for example 10.0.0.92:8080</p>
  <input id="addr" type="text">
  <div id="err"></div>
</div>
<div id="browse" class="screen">
  <h1 id="title">MovieStreamer</h1>
  <p class="hint">OK play · Red change server · Back exit</p>
  <div id="list"></div>
</div>
<div id="player" class="screen">
  <object id="av" type="application/avplayer"></object>
  <div id="sub"></div>
  <div id="pill"><span id="pilltext"></span></div>
  <div id="osd">
    <div id="name"></div>
    <div id="bar"><div id="fill"></div><div id="knob"></div></div>
    <div class="row"><span id="time"></span><span>OK pause · ◀▶ seek · ▲ subtitles · ▼ audio</span><span id="left"></span></div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
